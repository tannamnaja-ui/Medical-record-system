<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายการผู้ป่วย – ระบบลงวินิจฉัย ICD10</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Krub:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100vh; overflow: hidden; margin: 0; }
    body { background: #dbeafe; font-family: 'FreesiaUPC', sans-serif; display: flex; flex-direction: column; }
    body *:not(i):not([class*="fa-"]) { font-family: 'FreesiaUPC', sans-serif !important; font-size: var(--app-fs, 30px) !important; }
    i, [class*="fa-"] { font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands" !important; }
    input, select, textarea, .form-control, .form-select, .input-group-text { font-size: var(--app-fs, 30px) !important; }

    .navbar { background: linear-gradient(135deg, #90c4e8, #b8d8f0) !important; flex-shrink: 0; }
    .navbar, .navbar * { color: #000 !important; }
    .btn-outline-light { border-color: #000 !important; color: #000 !important; }

    /* main area เต็มพื้นที่ที่เหลือ */
    .main-area { flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 8px; min-height: 0; }

    /* card กินพื้นที่ทั้งหมด */
    .card { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
    .filter-toolbar { background: #f0f8ff; border-radius: 12px 12px 0 0; border-bottom: 1px solid #bee3f8; flex-shrink: 0; }

    /* table wrapper กินพื้นที่ที่เหลือทั้งหมด */
    .table-wrapper { flex: 1; overflow-x: scroll; overflow-y: auto; border-radius: 0 0 12px 12px; min-height: 0; }
    .table-wrapper::-webkit-scrollbar { height: 14px; width: 8px; }
    .table-wrapper::-webkit-scrollbar-track { background: #e0f0ff; }
    .table-wrapper::-webkit-scrollbar-thumb { background: #90c4e8; border-radius: 8px; }
    .table-wrapper::-webkit-scrollbar-thumb:hover { background: #60a5d4; }

    .table th { background: #90c4e8; color: #000; font-weight: 700; position: sticky; top: 0; z-index: 1; white-space: nowrap; border-right: 1px solid rgba(0,0,0,.15); }
    .table tbody tr { cursor: pointer; transition: background .15s; }
    .table tbody tr:hover { background: #bee3f8 !important; }
    .table tbody tr:nth-child(even) { background: #e8f4fd; }
    .table td { vertical-align: middle; white-space: nowrap; color: #000; border-right: 1px solid #d0e8f8; border-bottom: 1px solid #d0e8f8; }
    .badge-pdx { background: #cce5ff; color: #000; border: 1px solid #90c4e8; font-weight: 600; }
    .search-bar { border-radius: 20px; padding-left: 16px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-dot.connected { background: #22c55e; }
    .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,.6); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .spinner-border { width: 3rem; height: 3rem; }
    .col-vn { font-family: monospace; color: #000; }
    .col-time { color: #333; }
    .col-age { text-align: center; }
    .no-dx { color: #555; font-style: italic; }
    /* ปุ่มทั้งหมด pastel blue + ตัวดำ + 3D */
    .btn {
      box-shadow: 0 4px 0 rgba(0,0,0,.25), 0 2px 4px rgba(0,0,0,.15) !important;
      transform: translateY(0);
      transition: transform .08s, box-shadow .08s !important;
      border-bottom-width: 2px !important;
    }
    .btn:active {
      box-shadow: 0 1px 0 rgba(0,0,0,.2) !important;
      transform: translateY(3px);
    }
    .btn-primary { background: linear-gradient(to bottom, #a8d4f0, #7ab8e0) !important; border-color: #5090c0 !important; color: #000 !important; }
    .btn-primary:hover { background: linear-gradient(to bottom, #90c4e8, #60a5d4) !important; }
    .btn-outline-secondary { border-color: #90c4e8 !important; color: #000 !important; }
    .btn-outline-secondary:hover { background: #bee3f8 !important; }
    .btn-outline-light { background: linear-gradient(to bottom, #dff0ff, #b8d8f4) !important; border-color: #80b8e0 !important; color: #000 !important; }
    .btn-outline-light:hover { background: linear-gradient(to bottom, #c8e4f8, #90c4e8) !important; }
    /* text ทั้งหมดสีดำ */
    body *:not(i):not([class*="fa-"]) { color: #000 !important; }

    .btn-red   { background: linear-gradient(to bottom, #f87171, #dc2626) !important; border-color: #b91c1c !important; }
    .btn-red:hover   { background: linear-gradient(to bottom, #ef4444, #b91c1c) !important; }
    .btn-green { background: linear-gradient(to bottom, #4ade80, #16a34a) !important; border-color: #15803d !important; }
    .btn-green:hover { background: linear-gradient(to bottom, #22c55e, #15803d) !important; }

    /* สี สถานะปัจจุบัน — ใช้ specificity สูงกว่า body * rule */
    .table td .status-admit { color: #dc2626 !important; font-weight: 600; }
    .table td .status-done  { color: #16a34a !important; font-weight: 600; }

    /* วงกลม DiagText */
    .table td .dot-green { color: #22c55e !important; }
    .table td .dot-red   { color: #dc3545 !important; }

    /* dashboard cards */
    .dash-row { display: flex; gap: 8px; flex-shrink: 0; padding: 8px 8px 0; }
    .dash-card { flex: 1; border-radius: 12px; padding: 10px 14px; box-shadow: 0 2px 8px rgba(0,0,0,.1); border: 2px solid rgba(0,0,0,.18); display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .dash-card .dash-icon { font-size: calc(var(--app-fs, 30px) * 0.8) !important; opacity: .75; }
    .dash-card .dash-lbl  { font-size: var(--app-fs, 30px) !important; color: #333 !important; text-align: center; }
    .dash-card .dash-num  { font-size: calc(var(--app-fs, 30px) * 1.2) !important; font-weight: 700; line-height: 1; }
  </style>
</head>
<body>

  <nav class="navbar px-3 py-2">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-sm btn-outline-light" onclick="window.location.href='/index.html'">
        <i class="fas fa-home me-1"></i>หน้าแรก
      </button>
      <span class="navbar-brand fw-bold mb-0 fs-5">
        <i class="fas fa-users me-2"></i>รายการผู้ป่วย
      </span>
      <span id="hospitalName" class="text-dark" style="font-size:31px!important;"></span>
    </div>
    <div class="d-flex align-items-center gap-2 text-white small" id="navUser"></div>
  </nav>

  <!-- Loading -->
  <div class="loading-overlay d-none" id="loadingOverlay">
    <div class="text-center">
      <div class="spinner-border text-primary mb-2"></div>
      <div class="text-muted">กำลังโหลดข้อมูล...</div>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dash-row" id="dashboardRow">
    <div class="dash-card" style="background:#bfdbfe;">
      <i class="fas fa-users dash-icon"></i>
      <div class="dash-lbl">ผู้รับบริการทั้งหมด (ราย)</div>
      <div class="dash-num" id="d-total">–</div>
    </div>
    <div class="dash-card" style="background:#a5f3fc;">
      <i class="fas fa-file-medical dash-icon"></i>
      <div class="dash-lbl">มี DiagText (ราย)</div>
      <div class="dash-num" id="d-diagtext">–</div>
    </div>
    <div class="dash-card" style="background:#bbf7d0;">
      <i class="fas fa-check-circle dash-icon"></i>
      <div class="dash-lbl">บันทึก ICD10 แล้ว (ราย)</div>
      <div class="dash-num" id="d-has-icd">–</div>
    </div>
    <div class="dash-card" style="background:#fecaca;">
      <i class="fas fa-exclamation-circle dash-icon"></i>
      <div class="dash-lbl">ยังไม่บันทึก ICD10 (ราย)</div>
      <div class="dash-num" id="d-no-icd">–</div>
    </div>
  </div>

  <div class="main-area">
    <div class="card">

      <!-- Toolbar -->
      <div class="filter-toolbar p-2">
        <!-- แถว 1: วันที่ + ค้นหา + checkbox -->
        <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
          <label class="fw-semibold mb-0 text-nowrap">วันที่ :</label>
          <input type="date" class="form-control form-control-sm" id="dateFrom" style="width:180px;">
          <span class="fw-semibold mb-0 text-nowrap">ถึง</span>
          <input type="date" class="form-control form-control-sm" id="dateTo" style="width:180px;">
          <button class="btn btn-primary btn-sm" onclick="loadPatients()">
            <i class="fas fa-search me-1"></i>ค้นหา
          </button>
          <div class="input-group input-group-sm" style="width:290px;">
            <span class="input-group-text"><i class="fas fa-search"></i></span>
            <input type="text" class="form-control" id="searchInput" placeholder="ชื่อ / VN / ICD10...">
          </div>
          <label class="d-flex align-items-center gap-1 mb-0 ms-2" style="cursor:pointer;white-space:nowrap;">
            <input type="checkbox" id="chkNoIcd" onchange="applyFilters()" style="width:20px;height:20px;cursor:pointer;">
            <span class="text-danger fw-semibold">ยังไม่ลง ICD10</span>
          </label>
          <label class="d-flex align-items-center gap-1 mb-0 ms-2" style="cursor:pointer;white-space:nowrap;">
            <input type="checkbox" id="chkHasIcd" onchange="applyFilters()" style="width:20px;height:20px;cursor:pointer;">
            <span class="text-success fw-semibold">ลง ICD10 แล้ว</span>
          </label>
          <label class="d-flex align-items-center gap-1 mb-0 ms-2" style="cursor:pointer;white-space:nowrap;">
            <input type="checkbox" id="chkHasDxText" onchange="applyFilters()" style="width:20px;height:20px;cursor:pointer;">
            <span class="text-primary fw-semibold">มี diag text</span>
          </label>
          <span class="ms-auto fw-semibold text-primary" id="rowCount"></span>
        </div>
        <!-- แถว 2: searchable filters -->
        <div class="d-flex flex-wrap gap-2 align-items-center">
          <i class="fas fa-filter text-muted"></i>
          <div class="d-flex align-items-center gap-1">
            <label class="mb-0 text-nowrap text-muted" style="font-size:20px!important">แผนก:</label>
            <input type="text" class="form-control form-control-sm" id="filterSpclty"
              list="listSpclty" placeholder="พิมพ์เพื่อค้นหา..." oninput="applyFilters()" style="min-width:170px;">
            <datalist id="listSpclty"></datalist>
          </div>
          <div class="d-flex align-items-center gap-1">
            <label class="mb-0 text-nowrap text-muted" style="font-size:20px!important">ห้องตรวจ:</label>
            <input type="text" class="form-control form-control-sm" id="filterDep"
              list="listDep" placeholder="พิมพ์เพื่อค้นหา..." oninput="applyFilters()" style="min-width:170px;">
            <datalist id="listDep"></datalist>
          </div>
          <div class="d-flex align-items-center gap-1">
            <label class="mb-0 text-nowrap text-muted" style="font-size:20px!important">HN:</label>
            <input type="text" class="form-control form-control-sm" id="filterHN"
              placeholder="HN..." oninput="applyFilters()" style="width:120px;">
          </div>
          <button class="btn btn-sm btn-red" onclick="clearFilters()">
            <i class="fas fa-times me-1"></i>ล้าง
          </button>
          <button class="btn btn-sm btn-green" onclick="exportExcel()">
            <i class="fas fa-file-excel me-1"></i>ส่งออก Excel
          </button>
        </div>
      </div>

      <!-- Table -->
      <div class="table-wrapper">
        <table class="table table-sm mb-0" id="patientTable">
          <thead>
            <tr>
              <th>#</th>
              <th>วันที่มา</th>
              <th id="th-vsttime" style="cursor:pointer;user-select:none;" onclick="toggleSortTime()">เวลามา <i id="sort-icon-time" class="fas fa-sort"></i></th>
              <th>การมา</th>
              <th>สถานะปัจจุบัน</th>
              <th>HN</th>
              <th>ชื่อ - สกุล</th>
              <th>อายุ</th>
              <th>PDX</th>
              <th>แพทย์ผู้ตรวจ</th>
              <th>DiagText</th>
              <th>แผนก</th>
              <th>ห้องตรวจ</th>
              <th>สิทธิ์</th>
            </tr>
          </thead>
          <tbody id="patientBody">
            <tr>
              <td colspan="14" class="text-center text-muted py-5">
                <i class="fas fa-calendar-alt fa-2x mb-2 d-block"></i>
                เลือกวันที่แล้วกดค้นหา
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/patients.js"></script>
  <script src="/js/fontsize.js"></script>
</body>
</html>
