<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ – ระบบกลุ่มงานเวชระเบียน</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Krub:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100vh; overflow: hidden;
      background: linear-gradient(135deg, #b8d8f0 0%, #cce5ff 50%, #b8d8f0 100%);
      font-family: 'FreesiaUPC', sans-serif;
    }
    body { display: flex; flex-direction: column; }

    /* ─── header bar ─── */
    .top-bar {
      background: rgba(0,0,0,.25);
      backdrop-filter: blur(8px);
      padding: 6px 20px;
      display: flex; align-items: center;
      flex-shrink: 0;
    }
    .top-bar-brand { color: #fff; font-weight: 700; }
    .top-bar-brand i { color: #93c5fd; margin-right: 8px; }

    /* ─── login wrapper ─── */
    .login-wrapper {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 10px 16px;
      overflow: hidden;
    }
    .login-card {
      width: 100%; max-width: 520px;
      background: rgba(255,255,255,.97);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
      overflow: hidden;
    }
    .login-card-header {
      background: linear-gradient(135deg, #1a3a5c, #2563a8);
      padding: 14px 28px;
      text-align: center;
    }
    .login-card-header h5 { color: #fff; margin: 0; font-weight: 700; }
    .login-card-header p  { color: rgba(255,255,255,.7); margin: 2px 0 0; }

    .login-card-body { padding: 16px 28px 14px; }

    .form-label { font-weight: 600; color: #374151; margin-bottom: 4px; display: block; }
    .form-control {
      border-radius: 8px; border: 1.5px solid #e5e7eb;
      padding: 6px 12px; transition: border-color .2s, box-shadow .2s; width: 100%;
    }
    .form-control:focus { border-color: #2563a8; box-shadow: 0 0 0 3px rgba(37,99,168,.12); outline: none; }
    .input-group { display: flex; }
    .input-group .input-group-text {
      background: white; border: 1.5px solid #e5e7eb; border-right: none;
      border-radius: 8px 0 0 8px; padding: 6px 10px; display: flex; align-items: center;
    }
    .input-group .form-control { border-radius: 0 8px 8px 0; border-left: none; flex: 1; }
    .input-group .btn-eye {
      border: 1.5px solid #e5e7eb; border-left: none; border-radius: 0 8px 8px 0;
      background: white; padding: 6px 10px; cursor: pointer;
    }

    .mb-field { margin-bottom: 10px; }

    .btn-login {
      background: linear-gradient(135deg, #1a3a5c, #2563a8);
      color: #fff; border: none; border-radius: 10px;
      padding: 8px; font-weight: 600; width: 100%; margin-top: 4px; cursor: pointer;
      transition: opacity .2s;
    }
    .btn-login:hover { opacity: .88; }
    .btn-login:disabled { opacity: .6; }

    .divider { display: flex; align-items: center; gap: 8px; margin: 10px 0 8px; }
    .divider hr { flex: 1; border-color: #e5e7eb; }

    .btn-settings {
      width: 100%; border-radius: 8px; border: 1.5px solid #d1d5db;
      background: #f9fafb; color: #374151; font-weight: 500;
      padding: 7px; cursor: pointer; transition: background .15s;
    }
    .btn-settings:hover { background: #f0f4f8; border-color: #2563a8; }

    .alert { border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
    .alert-danger  { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .alert-warning { background: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
    .d-none { display: none !important; }

    .db-status { color: #6b7280; text-align: center; margin-top: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; vertical-align: middle; margin-right: 4px; }
    .dot-ok  { background: #22c55e; box-shadow: 0 0 5px #22c55e; }
    .dot-err { background: #ef4444; }

    /* === ขนาดตัวอักษรที่แสดง === */
    body *:not(i):not([class*="fa-"]) { font-family: 'FreesiaUPC', sans-serif !important; font-size: 30px !important; }
    i, [class*="fa-"] { font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands" !important; }
    input, select, textarea, .form-control, .form-select { font-size: 30px !important; }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="top-bar">
    <div class="top-bar-brand">
      <i class="fas fa-hospital-alt"></i>ระบบกลุ่มงานเวชระเบียน
    </div>
  </div>

  <!-- Login card -->
  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-card-header">
        <h5><i class="fas fa-stethoscope me-2"></i>เข้าสู่ระบบ</h5>
        <p>ระบบกลุ่มงานเวชระเบียน</p>
      </div>

      <div class="login-card-body">
        <div id="alertBox" class="alert d-none" role="alert"></div>

        <div class="mb-field">
          <label class="form-label"><i class="fas fa-user me-1"></i>ชื่อผู้ใช้</label>
          <input type="text" class="form-control" id="username"
            placeholder="ชื่อผู้ใช้" autocomplete="username">
        </div>

        <div class="mb-field">
          <label class="form-label"><i class="fas fa-lock me-1"></i>รหัสผ่าน</label>
          <div class="input-group">
            <input type="password" class="form-control" id="password"
              placeholder="รหัสผ่าน" autocomplete="current-password">
            <button class="btn-eye" type="button" onclick="togglePwd()">
              <i class="fas fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <div class="mb-field">
          <label class="form-label"><i class="fas fa-door-open me-1"></i>ห้องทำงาน</label>
          <select class="form-control" id="roomSelect">
            <option value="">-- เลือกห้องทำงาน --</option>
          </select>
          <label style="display:flex;align-items:center;gap:8px;margin-top:6px;cursor:pointer;">
            <input type="checkbox" id="rememberRoom" style="width:18px;height:18px;">
            <span style="font-size:20px!important;">จำห้องที่เลือกไว้</span>
          </label>
        </div>

        <button class="btn-login" id="btnLogin" onclick="doLogin()">
          <i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ
        </button>

        <div class="divider"><hr><span>การตั้งค่า</span><hr></div>

        <button class="btn-settings" onclick="window.location.href='/settings.html'">
          <i class="fas fa-database"></i> ตั้งค่าฐานข้อมูล
        </button>

        <div class="db-status" id="dbStatus">
          <span class="dot dot-err" id="dbDot"></span>
          <span id="dbStatusText">กำลังตรวจสอบการเชื่อมต่อ...</span>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
